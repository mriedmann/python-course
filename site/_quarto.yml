# Pinned stack (AGENTS.md rule 3). Change only via an explicit task + decision-log entry.
#   Quarto CLI   1.10.19
#   quarto-live  v0.2.0 (`quarto add r-wasm/quarto-live@v0.2.0`; its _extension.yml still says 0.1.3-dev)
#   Pyodide      0.28.1 (full distribution), hard-coded in _extensions/r-wasm/live/live.lua (setupPyodide):
#                indexURL https://cdn.jsdelivr.net/pyodide/v0.28.1/full/
#                Packages (plus micropip, pyodide_http, ipython) resolve via <indexURL>/pyodide-lock.json.
#                Self-hosting: set `pyodide: engine-url: <same-origin indexURL>` below. The worker bundles
#                the 0.28.1 loader and checks the version, so the copy must be Pyodide 0.28.1.
project:
  type: website
  resources:
    - components/*.js
    - sw.js
  post-render:
    - tools/sw_manifest.py

filters:
  - components/components.lua

website:
  title: "Python for Fluvia analysts"
  navbar:
    left:
      - href: index.qmd
        text: Home


format:
  live-html:
    theme: cosmo
    css: components/components.css
    # Exercise ladder (solution gate), Stop button and lesson components on every page; path via
    # Quarto's page offset.
    include-after-body:
      - text: |
          <script>
            // Offline: service worker at the site root (works under the /python-course/ sub-path).
            if ("serviceWorker" in navigator) {
              const root = new URL(document.querySelector('meta[name="quarto:offset"]').content, location.href);
              navigator.serviceWorker.register(new URL("sw.js", root), { scope: root.pathname }).catch(console.error);
            }
            for (const f of ["ladder.js", "stop.js", "drafts.js", "quiz.js", "predict.js", "parsons.js", "anim.js"]) {
              const s = document.createElement("script");
              s.src = document.querySelector('meta[name="quarto:offset"]').content + "components/" + f;
              document.body.appendChild(s);
            }
          </script>

pyodide:
  # quarto-live installs these with micropip from the Pyodide indexURL before the first cell is ready.
  packages:
    - pandas
    - matplotlib
    - requests
