# Pinned stack (AGENTS.md rule 3). Change only via an explicit task + decision-log entry.
#   Quarto CLI   1.10.19
#   quarto-live  v0.2.0 (`quarto add r-wasm/quarto-live@v0.2.0`; its _extension.yml still says 0.1.3-dev)
#   Pyodide      0.28.1 (full distribution), self-hosted in site/pyodide/ (gitignored; fill it with
#                `uv run python tools/fetch_pyodide.py`, which also reads `pyodide: packages` below).
#                live.lua's default indexURL is the jsDelivr CDN; `pyodide: engine-url` below replaces it.
#                The worker bundles the 0.28.1 loader and checks the version, so the copy must be 0.28.1.
project:
  type: website
  resources:
    - components/*.js
    - sw.js
    - pyodide/*
  post-render:
    - tools/sw_manifest.py

filters:
  - components/components.lua

website:
  title: "Python for Fluvia analysts"
  navbar:
    left:
      - href: index.qmd
        text: Home
    right:
      - href: "#pc-panel"
        text: Progress


format:
  live-html:
    theme: [cosmo, theme.scss]
    css: components/components.css
    # Error explanations, exercise ladder (solution gate), Stop button and lesson components on every
    # page; path via Quarto's page offset.
    # Instructor mode flag, set before first paint so nothing flashes (see components/instructor.js).
    include-in-header:
      - text: |
          <script>
            try {
              const v = new URLSearchParams(location.search).get("instructor");
              if (v !== null) sessionStorage.setItem("pycourse:instructor", v === "0" ? "0" : "1");
              if (sessionStorage.getItem("pycourse:instructor") === "1" &&
                  sessionStorage.getItem("pycourse:instructor-presenter") === "1") document.documentElement.classList.add("presenter");
              if (sessionStorage.getItem("pycourse:instructor") === "1") document.documentElement.classList.add("instructor");
            } catch { /* storage off: a plain ?instructor still works for this page */
              if (/[?&]instructor(=(?!0)|&|$)/.test(location.search)) document.documentElement.classList.add("instructor");
            }
          </script>
    include-after-body:
      - text: |
          <script>
            // Offline: service worker at the site root (works under the /python-course/ sub-path).
            if ("serviceWorker" in navigator) {
              const root = new URL(document.querySelector('meta[name="quarto:offset"]').content, location.href);
              navigator.serviceWorker.register(new URL("sw.js", root), { scope: root.pathname }).catch(console.error);
            }
            for (const f of ["errors.js", "ladder.js", "stop.js", "drafts.js", "quiz.js", "predict.js", "parsons.js", "anim.js", "instructor.js", "progress.js"]) {
              const s = document.createElement("script");
              s.src = document.querySelector('meta[name="quarto:offset"]').content + "components/" + f;
              document.body.appendChild(s);
            }
          </script>

pyodide:
  # engine-url is resolved by the Pyodide worker with `new URL(value, location)`. The worker is a normal
  # module worker (not a blob), so `location` is .../site_libs/quarto-contrib/live-runtime/pyodide-worker.js,
  # always three directories below the site root. A relative value therefore works on Pages (/python-course/),
  # locally (/) and in the offline package, with no host or build-time path. Breaks only if Quarto moves
  # the live-runtime folder (the smoke tests would catch it).
  engine-url: ../../../pyodide/
  # quarto-live installs these with micropip from the Pyodide indexURL before the first cell is ready.
  packages:
    - pandas
    - matplotlib
    - requests
