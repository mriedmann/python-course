<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title id="t">Spreadsheet with a repeated value formula</title>
  <desc id="d">A quote sheet with the columns quote_id, quantity, unit_price_eur and value. Every cell in the value column holds its own copy of the formula quantity times unit price: =B2*C2, =B3*C3, =B4*C4 and so on.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- formula bar -->
  <rect x="10" y="10" width="620" height="30" fill="#f3f3f3" stroke="#555"/>
  <text x="20" y="30" font-weight="bold" fill="#111">D3</text>
  <text x="60" y="30" fill="#111" font-style="italic">fx</text>
  <text x="90" y="30" fill="#111" font-family="Courier New, monospace">=B3*C3</text>
  <!-- column header row -->
  <g fill="#e4e4e4" stroke="#555">
    <rect x="10" y="50" width="40" height="28"/><rect x="50" y="50" width="150" height="28"/>
    <rect x="200" y="50" width="110" height="28"/><rect x="310" y="50" width="150" height="28"/>
    <rect x="460" y="50" width="170" height="28"/>
  </g>
  <g fill="#111" text-anchor="middle" font-weight="bold">
    <text x="125" y="69">A</text><text x="255" y="69">B</text><text x="385" y="69">C</text><text x="545" y="69">D</text>
  </g>
  <!-- rows -->
  <g stroke="#555" fill="#ffffff">
    <rect x="10" y="78" width="40" height="34"/><rect x="50" y="78" width="150" height="34"/><rect x="200" y="78" width="110" height="34"/><rect x="310" y="78" width="150" height="34"/><rect x="460" y="78" width="170" height="34"/>
    <rect x="10" y="112" width="40" height="34"/><rect x="50" y="112" width="150" height="34"/><rect x="200" y="112" width="110" height="34"/><rect x="310" y="112" width="150" height="34"/><rect x="460" y="112" width="170" height="34"/>
    <rect x="10" y="146" width="40" height="34"/><rect x="50" y="146" width="150" height="34"/><rect x="200" y="146" width="110" height="34"/><rect x="310" y="146" width="150" height="34"/><rect x="460" y="146" width="170" height="34"/>
    <rect x="10" y="180" width="40" height="34"/><rect x="50" y="180" width="150" height="34"/><rect x="200" y="180" width="110" height="34"/><rect x="310" y="180" width="150" height="34"/><rect x="460" y="180" width="170" height="34"/>
    <rect x="10" y="214" width="40" height="34"/><rect x="50" y="214" width="150" height="34"/><rect x="200" y="214" width="110" height="34"/><rect x="310" y="214" width="150" height="34"/><rect x="460" y="214" width="170" height="34"/>
  </g>
  <rect x="460" y="146" width="170" height="34" fill="none" stroke="#0b5394" stroke-width="3"/>
  <g fill="#111">
    <text x="30" y="100" text-anchor="middle">1</text><text x="60" y="100" font-weight="bold">quote_id</text><text x="210" y="100" font-weight="bold">quantity</text><text x="320" y="100" font-weight="bold">unit_price_eur</text><text x="470" y="100" font-weight="bold">value</text>
    <text x="30" y="134" text-anchor="middle">2</text><text x="60" y="134">Q2023-00001</text><text x="300" y="134" text-anchor="end">1</text><text x="450" y="134" text-anchor="end">2150,44</text>
    <text x="30" y="168" text-anchor="middle">3</text><text x="60" y="168">Q2023-00002</text><text x="300" y="168" text-anchor="end">1</text><text x="450" y="168" text-anchor="end">1345,18</text>
    <text x="30" y="202" text-anchor="middle">4</text><text x="60" y="202">Q2023-00003</text><text x="300" y="202" text-anchor="end">2</text><text x="450" y="202" text-anchor="end">3432,92</text>
    <text x="30" y="236" text-anchor="middle">5</text><text x="60" y="236">…</text><text x="300" y="236" text-anchor="end">…</text><text x="450" y="236" text-anchor="end">…</text>
  </g>
  <g fill="#0b5394" font-family="Courier New, monospace" font-weight="bold">
    <text x="470" y="134">=B2*C2</text><text x="470" y="168">=B3*C3</text><text x="470" y="202">=B4*C4</text><text x="470" y="236">=B5*C5 …</text>
  </g>
  <text x="10" y="280" fill="#111">The same formula is copied into every row, and again into every new sheet.</text>
</svg>
