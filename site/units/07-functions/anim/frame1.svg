<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <title id="t">Step 1: define the function</title>
  <desc id="d">The def block is highlighted. Python stores the function under the name tag quote_value. The name tag quotes is attached to the list of 20 quote lines. Nothing has been computed yet.</desc>
  <rect width="760" height="250" fill="#ffffff"/>
  <rect x="10" y="10" width="425" height="180" fill="#f6f6f6" stroke="#555"/>
  <rect x="12" y="24" width="421" height="96" fill="#fff2b3"/>
  <g font-family="Courier New, monospace" font-size="13" fill="#111">
    <text x="20" y="40">def quote_value(row):</text>
    <text x="51" y="62">"""Return the value in EUR of one quote line."""</text>
    <text x="51" y="84">value = row["quantity"] * row["unit_price_eur"]</text>
    <text x="51" y="106">return value</text>
    <text x="20" y="150" fill="#555">first_value = quote_value(quotes[0])</text>
    <text x="20" y="172" fill="#555">print(f"{first_value:.2f}")</text>
  </g>
  <text x="455" y="30" font-weight="bold" fill="#111">Name tags and values</text>
  <rect x="455" y="50" width="120" height="30" rx="15" fill="#0b5394"/>
  <text x="515" y="70" fill="#ffffff" text-anchor="middle" font-weight="bold">quote_value</text>
  <line x1="575" y1="65" x2="605" y2="65" stroke="#111" stroke-width="2"/>
  <rect x="605" y="45" width="145" height="40" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="677" y="62" text-anchor="middle" fill="#111">function</text>
  <text x="677" y="79" text-anchor="middle" fill="#111" font-family="Courier New, monospace" font-size="13">input: row</text>
  <rect x="455" y="110" width="120" height="30" rx="15" fill="#0b5394"/>
  <text x="515" y="130" fill="#ffffff" text-anchor="middle" font-weight="bold">quotes</text>
  <line x1="575" y1="125" x2="605" y2="125" stroke="#111" stroke-width="2"/>
  <rect x="605" y="105" width="145" height="40" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="677" y="130" text-anchor="middle" fill="#111">20 quote lines</text>
  <text x="10" y="235" fill="#111" font-weight="bold">1 Name the formula and list its inputs</text>
</svg>
