<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <title id="t">Step 2: call the function and compute</title>
  <desc id="d">The call line quote_value(quotes[0]) runs. Inside the call, the parameter row becomes a second name tag on the first quote line, quantity 1 and unit price 2150.44. The body computes 1 times 2150.44 and puts the name tag value on 2150.44. These two tags live only inside the call.</desc>
  <rect width="760" height="250" fill="#ffffff"/>
  <rect x="10" y="10" width="425" height="180" fill="#f6f6f6" stroke="#555"/>
  <rect x="12" y="68" width="421" height="22" fill="#fff2b3"/>
  <rect x="12" y="134" width="421" height="22" fill="#fff2b3"/>
  <g font-family="Courier New, monospace" font-size="13" fill="#111">
    <text x="20" y="40" fill="#555">def quote_value(row):</text>
    <text x="51" y="62" fill="#555">"""Return the value in EUR of one quote line."""</text>
    <text x="51" y="84">value = row["quantity"] * row["unit_price_eur"]</text>
    <text x="51" y="106" fill="#555">return value</text>
    <text x="20" y="150">first_value = quote_value(quotes[0])</text>
    <text x="20" y="172" fill="#555">print(f"{first_value:.2f}")</text>
  </g>
  <text x="455" y="30" font-weight="bold" fill="#111">Name tags and values</text>
  <rect x="455" y="45" width="100" height="30" rx="15" fill="#0b5394"/>
  <text x="505" y="65" fill="#ffffff" text-anchor="middle" font-weight="bold">quotes</text>
  <line x1="555" y1="60" x2="575" y2="60" stroke="#111" stroke-width="2"/>
  <rect x="575" y="40" width="180" height="70" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="585" y="58" fill="#111" font-size="13">quotes[0]</text>
  <rect x="582" y="64" width="166" height="38" fill="#e8f0fa" stroke="#0b5394"/>
  <text x="588" y="80" fill="#111" font-size="13">quantity: 1</text>
  <text x="588" y="96" fill="#111" font-size="13">unit_price_eur: 2150.44</text>
  <rect x="450" y="125" width="300" height="100" fill="none" stroke="#b45f06" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="460" y="143" fill="#b45f06" font-weight="bold" font-size="13">inside the call</text>
  <rect x="460" y="152" width="80" height="28" rx="14" fill="#b45f06"/>
  <text x="500" y="171" fill="#ffffff" text-anchor="middle" font-weight="bold">row</text>
  <line x1="540" y1="166" x2="667" y2="104" stroke="#111" stroke-width="2"/>
  <rect x="460" y="188" width="80" height="28" rx="14" fill="#b45f06"/>
  <text x="500" y="207" fill="#ffffff" text-anchor="middle" font-weight="bold">value</text>
  <line x1="540" y1="202" x2="600" y2="202" stroke="#111" stroke-width="2"/>
  <rect x="600" y="188" width="90" height="28" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="645" y="207" fill="#111" text-anchor="middle">2150.44</text>
  <text x="10" y="240" fill="#111" font-weight="bold">2 Call it: the argument gets the parameter's name, then the body computes</text>
</svg>
