name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - uses: actions/cache@v6
        with:
          path: site/pyodide
          key: pyodide-0.28.1-${{ hashFiles('site/_quarto.yml', 'tools/fetch_pyodide.py') }}
      - run: uv run python tools/fetch_pyodide.py
      - run: quarto render site
      - name: Check site size and data files
        run: |
          du -sh site/_site
          test "$(du -sm site/_site | cut -f1)" -le 300 || { echo "_site exceeds 300 MB"; exit 1; }
          test -f site/_site/data/quotes.csv
          test -f site/_site/sw-manifest.json
      - name: Browser smoke tests (headless Chrome on the runner)
        run: |
          google-chrome --version
          SKIP_RENDER=1 SMOKE_LOG_DIR=/tmp/smoke-logs bash tools/smoke_all.sh
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-logs
          path: /tmp/smoke-logs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
