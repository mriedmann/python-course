name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - run: quarto render site
      - name: Check site size and data files
        run: |
          du -sh site/_site
          test -f site/_site/data/quotes.csv
          test -f site/_site/sw-manifest.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
